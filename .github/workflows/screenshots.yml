# Takes screenshots of project websites for the portfolio and commits them
# to images/. Run it from the Actions tab with a list like
# "heavysets=https://heavysets.co.uk,gymplates=https://gymplates.co.uk".
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      sites:
        description: "name=url pairs, comma separated"
        required: true
        type: string

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node tools/shoot.mjs "$SITES"
        env:
          SITES: ${{ inputs.sites }}
      - name: Commit the screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.jpg
          git diff --cached --quiet && echo "No new screenshots." && exit 0
          git commit -m "Add project screenshots"
          git push
